<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="100%" height="100%" fill="white"/>

  <!-- Steam -->
  <path d="M620 180 C560 260, 700 320, 620 430" 
        fill="none" stroke="#D4AF37" stroke-width="18" stroke-linecap="round"/>

  <!-- Candles -->
  <g stroke-width="8">
    <!-- Left green -->
    <line x1="470" y1="360" x2="470" y2="520" stroke="#7ED957"/>
    <rect x="440" y="390" width="60" height="100" fill="#4CAF50" stroke="#7ED957"/>

    <!-- Middle red -->
    <line x1="580" y1="340" x2="580" y2="540" stroke="#FF6B4A"/>
    <rect x="550" y="390" width="60" height="110" fill="#E53935" stroke="#FF6B4A"/>

    <!-- Right green -->
    <line x1="700" y1="300" x2="700" y2="520" stroke="#7ED957"/>
    <rect x="670" y="350" width="60" height="130" fill="#4CAF50" stroke="#7ED957"/>
  </g>

  <!-- Cup outline -->
  <ellipse cx="600" cy="610" rx="280" ry="60" fill="none" stroke="#D4AF37" stroke-width="10"/>
  <path d="M850 620 C980 620, 980 860, 760 920" 
        fill="none" stroke="#D4AF37" stroke-width="12" stroke-linecap="round"/>
  <path d="M840 620 C940 600, 980 700, 900 760" 
        fill="none" stroke="#D4AF37" stroke-width="10" stroke-linecap="round"/>

  <!-- Text -->
  <text x="600" y="760" text-anchor="middle" font-size="120" font-family="Georgia, serif" fill="#B8860B">HODL</text>
  <text x="600" y="860" text-anchor="middle" font-size="90" font-family="Arial, sans-serif" fill="#B8860B">&amp;Sip</text>

  <!-- Name lines -->
  <line x1="380" y1="980" x2="820" y2="980" stroke="#C8A96A" stroke-width="3"/>
  <line x1="380" y1="1030" x2="820" y2="1030" stroke="#C8A96A" stroke-width="3"/>
</svg>
